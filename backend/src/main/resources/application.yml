spring:
  application:
    name: siscep-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/siscep}
    username: ${DB_USERNAME:siscep}
    password: ${DB_PASSWORD:siscep}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

siscep:
  jwt:
    secret: ${JWT_SECRET:c2lzY2VwLWNoYXZlLWRlLWRlc2Vudm9sdmltZW50by10cm9xdWUtZW0tcHJvZHVjYW8=}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}
  cors:
    origens-permitidas: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
